<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ict</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; padding: 32px 16px; line-height: 1.5; }
.page { max-width: 860px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.header { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; margin-bottom: 24px; }
.title { font-size: 20px; font-weight: 600; color: #0f172a; }
.sub { font-size: 12px; color: #475569; margin-top: 3px; }
.badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 999px; background: rgba(13,148,136,0.06); color: #0d9488; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat { padding: 12px 14px; background: #f8fafc; border-radius: 8px; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: #94a3b8; margin-bottom: 4px; }
.stat-value { font-size: 13px; font-weight: 600; color: #0f172a; min-height: 18px; border-bottom: 1px dashed #e2e8f0; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin: 20px 0 10px; font-weight: 600; }
.group { margin-bottom: 16px; }
.group-title { font-size: 11px; font-weight: 600; color: #0d9488; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 4px; background: #f8fafc; border-radius: 6px; font-size: 13px; }
.item.is-checked { opacity: 0.6; }
.item.is-checked .text { text-decoration: line-through; }
.check { width: 18px; height: 18px; border: 1.5px solid #e2e8f0; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #0d9488; flex-shrink: 0; }
.item.is-checked .check { background: rgba(13,148,136,0.06); border-color: #0d9488; }
.notes { min-height: 120px; padding: 12px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
.footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid #e2e8f0; font-size: 10.5px; color: #94a3b8; text-align: center; }
@media print { body { background: white; padding: 0; } .page { box-shadow: none; border: none; } }
</style>
</head>
<body>
<div class="page">
<div class="header"><div><div class="title">Trading Plan</div><div class="sub">Indicator-Based · 0/4 checked</div></div><div class="badge">ict</div></div>
<div class="grid">
<div class="stat"><div class="stat-label">Date</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Time</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Asset</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Entry</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Stop</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Target</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">R:R Planned</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">R Realized</div><div class="stat-value"></div></div>
<div class="stat"><div class="stat-label">Outcome</div><div class="stat-value"></div></div>
</div>
<div class="section-title">Pre-Trade Checklist</div>
<div class="group"><div class="group-title">HTF / Long Term</div><div class="item "><span class="check"></span><span class="text">1H: MA cross</span></div><div class="item "><span class="check"></span><span class="text">1H: RSI level</span></div></div><div class="group"><div class="group-title">Entry / LTF</div><div class="item "><span class="check"></span><span class="text">15M: MACD signal</span></div><div class="item "><span class="check"></span><span class="text">15M: Entry confirmation</span></div></div>
<div class="section-title">Notes</div>
<div class="notes"></div>
<div class="footer">Generated 10/22/2026 · Trading Manager v0.1.0</div>
</div>
</body>
</html>
